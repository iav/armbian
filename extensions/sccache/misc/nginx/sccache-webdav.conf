# nginx WebDAV configuration for sccache remote storage.
#
# sccache talks WebDAV (full subset) — unlike ccache it issues a
# PROPFIND on the cache root at startup. The stock ngx_http_dav_module
# only ships PUT/DELETE/MKCOL/COPY/MOVE; PROPFIND comes from
# ngx_http_dav_ext_module (Debian/Ubuntu: libnginx-mod-http-dav-ext).
# Without the ext module sccache silently marks every PUT as a write
# error.
#
# Copy to /etc/nginx/sites-available/sccache-webdav,
# then: ln -s /etc/nginx/sites-available/sccache-webdav /etc/nginx/sites-enabled/
#
# Prepare storage directory:
#   mkdir -p /var/cache/sccache-webdav/sccache
#   chown -R www-data:www-data /var/cache/sccache-webdav
#
# WARNING: No authentication configured.
# Use ONLY in a fully trusted private network.
# For auth, add auth_basic directives or front with a reverse proxy.

server {
    listen 8089;
    server_name _;
    root /var/cache/sccache-webdav;

    location /sccache/ {
        # Stock WebDAV (PUT/DELETE/MKCOL/COPY/MOVE)
        dav_methods PUT DELETE MKCOL COPY MOVE;
        # Required by sccache (PROPFIND on init); needs libnginx-mod-http-dav-ext
        dav_ext_methods PROPFIND OPTIONS;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;
        client_max_body_size 100M;
        autoindex on;
    }
}
