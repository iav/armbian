name: "Audit: Shellcheck (ludeeus)"
run-name: "ludeeus shellcheck — ${{ inputs.repository }}@${{ inputs.ref }}"

# On-demand audit. Runs ludeeus/action-shellcheck against an arbitrary public
# repo + ref. Annotations show up in the workflow run via GitHub problem
# matchers (gutter icons next to source lines, hover shows SC code + message).

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Target repo (owner/name). Public repos work without a token."
        required: true
        default: "armbian/build"
      ref:
        description: "Branch, tag, or commit SHA to scan."
        required: true
        default: "main"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout target repo"
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: "Register shellcheck problem matcher"
        run: |
          # Inline matcher — checkout has overwritten the workflow's own
          # repo with the target one, so we cannot reference an in-repo
          # path. Drop the JSON into RUNNER_TEMP, which is unaffected.
          cat > "$RUNNER_TEMP/shellcheck-matcher.json" <<'JSON'
          {
            "problemMatcher": [
              {
                "owner": "shellcheck-gcc",
                "pattern": [
                  {
                    "regexp": "^(.+):(\\d+):(\\d+):\\s+(note|warning|error):\\s+(.*)\\s+\\[(SC\\d+)\\]$",
                    "file": 1,
                    "line": 2,
                    "column": 3,
                    "severity": 4,
                    "message": 5,
                    "code": 6
                  }
                ]
              }
            ]
          }
          JSON
          echo "::add-matcher::$RUNNER_TEMP/shellcheck-matcher.json"

      - name: "Collect bash-shebang scripts (mirroring upstream filter)"
        id: collect
        run: |
          files=$(find . -type f \
            ! -path './lib/*' ! -path './extensions/*' ! -path './cache/*' ! -path './.git/*' \
            ! -name '*.py' ! -name '*.service' ! -name '*.rules' ! -name '*.network' ! -name '*.netdev' \
            -exec grep -lE '^#!/.*bash' {} + 2>/dev/null | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "$files" | tr ' ' '\n' | sed '/^$/d'

      - name: "ludeeus/action-shellcheck"
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          check_together: 'yes'
          additional_files: ${{ steps.collect.outputs.files }}
          ignore_paths: >-
            cache
            .git
            lib
            extensions
          ignore_names: >-
            *.py
            *.service
            *.rules
            *.network
            *.netdev
